<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jewelry Planner - PocketSmart AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <header>
        <h1>Jewelry Planner</h1>
        <nav>
            <a href="/">Home</a>
            <a href="/dashboard">Dashboard</a>
        </nav>
    </header>

    <main class="container">
        <h2>Find Matching Jewelry Within Your Budget</h2>
        <form id="jewelryForm">
            <label for="occasion">Occasion Type:</label>
            <input type="text" id="occasion" name="occasion" placeholder="e.g., Wedding, Party, Casual" required>

            <label for="budget">Total Budget ($ / ₹):</label>
            <input type="number" id="budget" name="budget" placeholder="e.g., 15000" required>

            <button type="submit" class="btn">Get Recommendations</button>
        </form>

        <div id="result" class="result-box" style="display:none;">
            <h3>Recommended Jewelry Pieces:</h3>
            <p id="outputContent"></p>
        </div>
    </main>

 <script>
  document.addEventListener('DOMContentLoaded', () => {
    // Select form or fallback to button click if form tag is missing
    const form = document.getElementById('jewelryForm');
    
    const handleSubmit = async (e) => {
      e.preventDefault();
      
      const occasionInput = document.getElementById('occasion');
      const budgetInput = document.getElementById('budget');
      const outputContent = document.getElementById('outputContent');
      const resultContainer = document.getElementById('result');

      if (!occasionInput || !budgetInput) {
        alert("Could not find input fields. Check if IDs 'occasion' and 'budget' exist on inputs.");
        return;
      }

      if (outputContent) outputContent.innerText = "Generating recommendations... Please wait.";
      if (resultContainer) resultContainer.style.display = 'block';

      try {
        const response = await fetch('/generate_jewelry', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            occasion: occasionInput.value,
            budget: budgetInput.value
          })
        });

        const data = await response.json();
        
        if (data.result) {
          outputContent.innerText = data.result;
        } else {
          outputContent.innerText = "Error: " + (data.error || "No response generated.");
        }
      } catch (err) {
        console.error(err);
        if (outputContent) outputContent.innerText = "Failed to fetch recommendations. Check console.";
      }
    };

    if (form) {
      form.addEventListener('submit', handleSubmit);
    } else {
      // Fallback if no <form id="jewelryForm"> tag exists
      const btn = document.querySelector('button');
      if (btn) btn.addEventListener('click', handleSubmit);
    }
  });
</script>  
</body>
</html>
